# Dependabot configuration file
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # npm (vendored frontend libraries in /assets)
  # Manifest tracks upstream releases only; committed vendor copies are updated manually.
  - package-ecosystem: "npm"
    directory: "/assets"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "npm"
    ignore:
      # bootstrap stays on the 5.x line, do not bump to 6.x
      - dependency-name: "bootstrap"
        update-types: ["version-update:semver-major"]
      # bootstrap4 alias stays on the frozen 4.x line, do not bump to 5.x
      - dependency-name: "bootstrap4"
        update-types: ["version-update:semver-major"]
      # leaflet stays on the 1.x line, inlined module CSS matches 1.x
      - dependency-name: "leaflet"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "ci"
